server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: flow-manager
              uri: lb://flow-manager-service
              predicates:
                - Path=/files/**
              filters:
                - RewritePath=/files/(?<segment>.*), /api/v1/files/${segment}

  security:
    oauth2:
      resourceserver:
        jwt:
          # URL, где Keycloak отдает публичные ключи для проверки подписи JWT.
          # Важно: используем имя контейнера 'keycloak' и внутренний порт 8080,
          # так как Spring находится внутри той же Docker-сети.
          jwk-set-uri: http://keycloak:8080/realms/api-gateway/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Временно включаем DEBUG логи для безопасности, чтобы видеть, почему запрос проходит или блокируется
logging:
  level:
    org.springframework.security: DEBUG